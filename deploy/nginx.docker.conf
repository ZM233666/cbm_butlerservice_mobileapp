upstream butler_app {
    server butler:3100;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 任务图片：与 Node UPLOADS_DIR=/data/uploads/task、Django MEDIA_ROOT/uploads/task 同一 volume
    location /uploads/task/ {
        alias /data/uploads/task/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 证书等仍走 Node 侧 server/uploads
    location /uploads/ {
        alias /app/server/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/upload {
        proxy_pass http://butler_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 32m;
    }

    location / {
        proxy_pass http://butler_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
