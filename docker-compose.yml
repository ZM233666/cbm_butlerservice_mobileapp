services:
  butler:
    build:
      context: .
      dockerfile: Dockerfile
    image: butler-service:latest
    container_name: butler-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3100
    ports:
      - "${APP_PORT:-3100}:3100"
    volumes:
      - ./server/data:/app/server/data
      - ./server/uploads:/app/server/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    profiles: ["with-nginx"]
    image: nginx:1.27-alpine
    container_name: butler-nginx
    restart: unless-stopped
    depends_on:
      butler:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
