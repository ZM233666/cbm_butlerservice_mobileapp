services:
  butler:
    build:
      context: .
      dockerfile: Dockerfile
    image: butler-service:latest
    container_name: butler-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3100
      NODE_CLUSTER_ENABLED: "1"
      NODE_CLUSTER_WORKERS: "${NODE_CLUSTER_WORKERS:-8}"
      UPLOADS_DIR: /data/uploads/task
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-30}"
      AUTH_UPSTREAM_MAX_CONCURRENCY: "${AUTH_UPSTREAM_MAX_CONCURRENCY:-16}"
      AUTH_UPSTREAM_QUEUE_MAX: "${AUTH_UPSTREAM_QUEUE_MAX:-64}"
      AUTH_UPSTREAM_QUEUE_WAIT_MS: "${AUTH_UPSTREAM_QUEUE_WAIT_MS:-3000}"
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 768M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-127.0.0.1:3100}:3100"
    volumes:
      - ./server/data:/app/server/data
      # 证书 / manifest 等仍落在 server/uploads；任务图走共享目录
      - ./server/uploads:/app/server/uploads
      - ${TASK_UPLOADS_HOST_DIR:-../butler-service/backend/media/uploads/task}:/data/uploads/task
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    profiles: ["with-nginx"]
    image: nginx:1.27-alpine
    container_name: butler-nginx
    restart: unless-stopped
    depends_on:
      butler:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/uploads:/app/server/uploads:ro
      - ${TASK_UPLOADS_HOST_DIR:-../butler-service/backend/media/uploads/task}:/data/uploads/task:ro

  nginx-ssl:
    profiles: ["with-nginx-ssl"]
    image: nginx:1.27-alpine
    container_name: butler-nginx-ssl
    restart: unless-stopped
    depends_on:
      butler:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.ssl.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/uploads:/app/server/uploads:ro
      - ${TASK_UPLOADS_HOST_DIR:-../butler-service/backend/media/uploads/task}:/data/uploads/task:ro
      - ${SSL_CERT_PATH:-./certs/fullchain.pem}:/etc/nginx/ssl/fullchain.pem:ro
      - ${SSL_KEY_PATH:-./certs/privkey.pem}:/etc/nginx/ssl/privkey.pem:ro
